short_bio: >-
  <p>
    I am a second-year M.S./Ph.D. student in the
    Department of Semiconductor System Engineering at Korea University.
    I am a member of <a href="https://comsys-lab.github.io/">ComSys Lab</a>,
    advised by Prof. Yunho Oh.
  </p>
  <p>
    My research interests focus on designing <strong>advanced computing systems</strong>,
    including hardware and software architectures for <strong>GPUs</strong> and
    <strong>processing-in-memory (PIM) systems</strong>. I aim to improve performance and 
    energy efficiency for demanding applications through effective use of hardware 
    resources, particularly in resource-constrained environments.
  </p>

